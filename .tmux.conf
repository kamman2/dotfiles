# Enable extended keys for better keyboard support
set -g extended-keys on

# Use unified status-style (Fixes legacy 'status-attr' errors)
set -g status-style "bg=colour235,fg=colour136"

# Ensure 2x2 grid looks sharp (TrueColor support)
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable Mouse support (Crucial for VSCodium pane resizing)
set -g mouse on
set -g set-clipboard on

# Increase history for long vLLM logs
set -g history-limit 10000

# ─── Host-based visual themes ────────────────────────────────────────────────
# Each remote machine gets a distinct color scheme in tmux

# Default (local machine)
set -g status-style "bg=colour235,fg=colour136"
set -g pane-border-style "fg=colour235"
set -g window-style "bg=colour235"

# Host-based themes (compatible with tmux 3.4)
run-shell 'if [[ $(hostname) == "m-c7010" ]]; then
    tmux set -g status-style "bg=colour1,fg=colour15"
    tmux set -g pane-border-style "fg=colour1"
    tmux set -g pane-active-border-style "fg=colour196"
    tmux set -g window-style "bg=colour52"
elif [[ $(hostname) == "Z790-5090-ubuntu" ]]; then
    tmux set -g status-style "bg=colour6,fg=colour15"
    tmux set -g pane-border-style "fg=colour6"
    tmux set -g pane-active-border-style "fg=colour51"
    tmux set -g window-style "bg=colour22"
fi'